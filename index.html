<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /**
       * Safeguard against iframe/preview environment defining window.fetch with only a getter.
       * Ensures that subsequent scripts or libraries attempting to wrap or assign window.fetch
       * do not throw 'TypeError: Cannot set property fetch of #<Window> which has only a getter'.
       */
      (function() {
        try {
          function patchDescriptor(prop, descriptor) {
            if (prop === 'fetch' && descriptor && descriptor.get && !descriptor.set) {
              descriptor.configurable = true;
              let customFetch = null;
              const origGet = descriptor.get;
              descriptor.set = function(newVal) {
                customFetch = newVal;
              };
              descriptor.get = function() {
                return customFetch !== null ? customFetch : origGet.call(this);
              };
            }
          }

          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            patchDescriptor(prop, descriptor);
            return originalDefineProperty.call(Object, obj, prop, descriptor);
          };

          if (typeof Reflect !== 'undefined' && Reflect.defineProperty) {
            const originalReflectDefineProperty = Reflect.defineProperty;
            Reflect.defineProperty = function(target, propertyKey, attributes) {
              patchDescriptor(propertyKey, attributes);
              return originalReflectDefineProperty.call(Reflect, target, propertyKey, attributes);
            };
          }
        } catch (e) {
          // Graceful fallback
        }

        // Initialize theme before DOM render to prevent flash
        try {
          const savedTheme = localStorage.getItem('noc-theme');
          const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          const initialTheme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', initialTheme);
          if (initialTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthStream - Infrastructure Telemetry</title>
    <meta name="description" content="HealthStream - Infrastructure Telemetry. Real-time fleet health metrics, node registration, search, filtering, and SNMP monitoring." />
    <meta property="og:title" content="HealthStream - Infrastructure Telemetry" />
    <meta property="og:description" content="HealthStream - Infrastructure Telemetry. Real-time fleet health metrics, node registration, search, filtering, and SNMP monitoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
